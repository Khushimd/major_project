{% extends "base.html" %}
{% block title %}Forgot password — {{ app_title }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width: 440px;">
    <div class="section-head">
      <h2>Forgot password</h2>
      <p>For security, password resets are performed by a clinic administrator — not by email from this demo system.</p>
    </div>
    <form method="post" class="form-pane">
      <label class="form-label">Account email</label>
      <input class="form-control mb-3" type="email" name="email" required />
      <button class="btn btn-cta w-100" type="submit">Request help</button>
      <p class="mt-3 mb-0"><a href="{{ url_for('auth.login', role='patient') }}">Back to patient login</a></p>
    </form>
  </div>
</section>
{% endblock %}
